# pyproject.toml
[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "lakehouse"
version = "0.1.0"
description = "Lightweight DuckDB lakehouse with medallion architecture"
authors = [{ name = "Z Knight" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0.0,<2.0.0",
  "pandas>=2.2.0",
  "pyarrow>=14.0.0"
]

[tool.hatch.build]
packages = ["src/lakehouse"]